<!-- @dsCard group="Components" viewport="700x460" name="Forms" subtitle="Input, Select, Checkbox, Radio, Switch" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--font-body);background:var(--surface-page);}#root{padding:20px;}</style>
<div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.DreamBricksDesignSystem_6b66b1;

function Demo(){
  const [name, setName] = React.useState('');
  const [status, setStatus] = React.useState('active');
  const [checked, setChecked] = React.useState(true);
  const [view, setView] = React.useState('grid');
  const [notify, setNotify] = React.useState(false);
  return (
    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:20, maxWidth:640}}>
      <Input label="Project name" placeholder="e.g. Q3 rebrand" value={name} onChange={e=>setName(e.target.value)} hint="Shown on the dashboard card"/>
      <Input label="Budget" type="text" error="Required field" value=""/>
      <Select label="Status" value={status} onChange={e=>setStatus(e.target.value)}
        options={[{value:'active',label:'Active'},{value:'paused',label:'Paused'},{value:'done',label:'Completed'}]}/>
      <div style={{display:'flex', flexDirection:'column', gap:10, justifyContent:'center'}}>
        <Checkbox label="Notify team on update" checked={checked} onChange={e=>setChecked(e.target.checked)}/>
        <Checkbox label="Indeterminate example" indeterminate/>
      </div>
      <div style={{display:'flex', flexDirection:'column', gap:10, justifyContent:'center'}}>
        <Radio name="view" label="Grid view" checked={view==='grid'} onChange={()=>setView('grid')}/>
        <Radio name="view" label="List view" checked={view==='list'} onChange={()=>setView('list')}/>
      </div>
      <div style={{display:'flex', alignItems:'center'}}>
        <Switch label="Email notifications" checked={notify} onChange={e=>setNotify(e.target.checked)}/>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
