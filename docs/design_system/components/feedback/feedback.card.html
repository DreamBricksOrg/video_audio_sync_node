<style>body{margin:0;font-family:var(--font-body);background:var(--surface-page);}#root{padding:20px;}</style>
<div id="root"></div>
<script type="text/babel">
const { Dialog, Toast, Tooltip, Button, IconButton } = window.DreamBricksDesignSystem_6b66b1;
function Demo(){
  const [open, setOpen] = React.useState(false);
  return (
    <div style={{display:'flex', flexDirection:'column', gap:20}}>
      <div style={{display:'flex', gap:12, alignItems:'center'}}>
        <Button onClick={()=>setOpen(true)}>Open dialog</Button>
        <Tooltip label="Delete project"><IconButton icon={<span>🗑</span>} label="Delete"/></Tooltip>
      </div>
      <div style={{display:'flex', flexDirection:'column', gap:10}}>
        <Toast tone="success" title="Project saved" message="All changes synced."/>
        <Toast tone="warning" title="Deadline approaching" message="3 days left on Q3 rebrand."/>
        <Toast tone="danger" title="Sync failed" message="Check your connection." onClose={()=>{}}/>
      </div>
      <Dialog open={open} onClose={()=>setOpen(false)} title="Archive project?"
        actions={<><Button variant="secondary" onClick={()=>setOpen(false)}>Cancel</Button><Button variant="danger" onClick={()=>setOpen(false)}>Archive</Button></>}>
        This can be undone from Settings within 30 days.
      </Dialog>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
