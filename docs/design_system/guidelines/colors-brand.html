<!-- @dsCard group="Colors" viewport="700x180" name="Brand Blues" subtitle="Extracted from brandbook v1.1, page 4" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);}
  .row{display:flex;height:180px;}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box;}
  .sw span{font-size:12px;font-weight:600;}
  .sw small{display:block;font-size:11px;opacity:0.8;font-family:var(--font-mono);}
</style>
<div class="row">
  <div class="sw" style="background:var(--db-blue-900);color:white;"><span>900 Ink</span><small>#034a5d</small></div>
  <div class="sw" style="background:var(--db-blue-500);color:white;"><span>500 Primary</span><small>#42b0d5</small></div>
  <div class="sw" style="background:var(--db-blue-300);color:var(--db-blue-900);"><span>300 Bright</span><small>#52cdef</small></div>
  <div class="sw" style="background:var(--db-blue-50);color:var(--db-blue-900);"><span>50 Tint</span><small>#c7f1ff</small></div>
  <div class="sw" style="background:var(--db-white);color:var(--db-blue-900);border-left:1px solid #eee;"><span>White</span><small>#ffffff</small></div>
</div>
