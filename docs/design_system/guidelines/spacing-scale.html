<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing Scale" subtitle="4px base grid, 4–96px" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-mono);font-size:10px;padding:16px;box-sizing:border-box;background:var(--surface-card);color:var(--text-secondary);}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .bar{background:var(--db-blue-500);height:14px;border-radius:2px;}
  .lbl{width:70px;flex-shrink:0;}
</style>
<div class="row"><span class="lbl">space-1 4</span><div class="bar" style="width:var(--space-1)"></div></div>
<div class="row"><span class="lbl">space-2 8</span><div class="bar" style="width:var(--space-2)"></div></div>
<div class="row"><span class="lbl">space-3 12</span><div class="bar" style="width:var(--space-3)"></div></div>
<div class="row"><span class="lbl">space-4 16</span><div class="bar" style="width:var(--space-4)"></div></div>
<div class="row"><span class="lbl">space-6 24</span><div class="bar" style="width:var(--space-6)"></div></div>
<div class="row"><span class="lbl">space-8 32</span><div class="bar" style="width:var(--space-8)"></div></div>
<div class="row"><span class="lbl">space-12 48</span><div class="bar" style="width:var(--space-12)"></div></div>
<div class="row"><span class="lbl">space-16 64</span><div class="bar" style="width:var(--space-16)"></div></div>
<div class="row"><span class="lbl">space-24 96</span><div class="bar" style="width:var(--space-24)"></div></div>
