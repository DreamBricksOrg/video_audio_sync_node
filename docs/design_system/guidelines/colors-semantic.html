<!-- @dsCard group="Colors" viewport="700x140" name="Semantic" subtitle="Intentional addition — success / warning / danger / info" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);font-size:13px;font-weight:600;}
  .row{display:flex;height:140px;}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box;gap:4px;}
  .chip{width:28px;height:28px;border-radius:var(--radius-md);}
</style>
<div class="row">
  <div class="sw" style="background:var(--db-success-100);color:var(--db-success-500);"><div class="chip" style="background:var(--db-success-500)"></div>Success</div>
  <div class="sw" style="background:var(--db-warning-100);color:#8a5a00;"><div class="chip" style="background:var(--db-warning-500)"></div>Warning</div>
  <div class="sw" style="background:var(--db-danger-100);color:var(--db-danger-500);"><div class="chip" style="background:var(--db-danger-500)"></div>Danger</div>
  <div class="sw" style="background:var(--db-info-100);color:var(--db-blue-700);"><div class="chip" style="background:var(--db-info-500)"></div>Info</div>
</div>
