<!-- @dsCard group="Spacing" viewport="700x150" name="Shadow Scale" subtitle="Soft, cool-toned — no harsh black shadows" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-mono);font-size:10px;padding:20px;box-sizing:border-box;background:var(--surface-sunken);display:flex;gap:24px;color:var(--text-secondary);}
  .box{background:var(--surface-card);width:80px;height:80px;border-radius:var(--radius-md);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;}
</style>
<div class="box" style="box-shadow:var(--shadow-sm)">sm</div>
<div class="box" style="box-shadow:var(--shadow-md)">md</div>
<div class="box" style="box-shadow:var(--shadow-lg)">lg</div>
<div class="box" style="box-shadow:var(--shadow-focus)">focus</div>
