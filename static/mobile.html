<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#034a5d">
    <title>Áudio sincronizado — DreamBricks</title>
    <link rel="stylesheet" href="/static/css/design-system/styles.css">
    <link rel="stylesheet" href="/static/css/mobile.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- ── OVERLAY: toque para iniciar (autoplay fallback) ── -->
    <div class="tap-overlay" id="tapOverlay">
        <img src="/static/images/dreambricks-horizontal-onblue.svg" alt="DreamBricks" class="brand-logo">
        <div class="tap-center">
            <div class="tap-icon" id="tapIcon"><i data-lucide="headphones"></i></div>
            <div class="tap-text" id="tapText">Toque para ouvir</div>
            <div class="tap-sub" id="tapSub">O áudio será sincronizado automaticamente</div>
            <div class="tap-loading hidden" id="tapLoading">Conectando ao totem...</div>
        </div>
    </div>

    <!-- ── MAIN: mostrado após o áudio começar ──────────── -->
    <div class="mobile-container hidden" id="mainUI">
        <img src="/static/images/dreambricks-horizontal-onblue.svg" alt="DreamBricks" class="brand-logo">

        <div class="now-playing">
            <h1><i data-lucide="headphones"></i> Reproduzindo</h1>

            <div class="visualizer" id="visualizer">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
        </div>

        <!-- <div class="status-badge playing" id="statusBadge">
            <i data-lucide="music" id="statusIcon"></i>
            <span id="statusLabel">Sincronizado</span>
        </div> -->

        <!-- Text and links come from the admin (per totem), see js/promo.js -->
        <div class="promo-box hidden" id="promoBox">
            <div class="promo-text" id="promoText"></div>
            <div class="social-buttons" id="promoButtons"></div>
        </div>
    </div>

    <!-- HTML5 audio element — iOS needs this for audio session activation -->
    <audio id="audioPlayer" preload="auto" playsinline></audio>

    <script src="/static/js/promo.js"></script>
    <script src="/static/js/sync-player.js"></script>
    <script src="/static/js/mobile.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
