<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — DreamBricks</title>
    <link rel="stylesheet" href="/static/css/design-system/styles.css">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <main class="login-page">
        <form id="loginForm" class="login-card" novalidate>
            <img src="/static/images/dreambricks-horizontal-onlight.svg" alt="DreamBricks" class="brand-logo">

            <div class="login-heading">
                <h1>Central de Campanhas</h1>
                <p>Entre para gerenciar as campanhas e as mídias.</p>
            </div>

            <div class="field">
                <label for="username">Usuário ou e-mail</label>
                <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            </div>

            <div class="field">
                <label for="password">Senha</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>

            <p id="loginError" class="login-error" role="alert" hidden></p>

            <button id="loginBtn" type="submit" class="btn btn-primary">Entrar</button>
        </form>
    </main>

    <script src="/static/js/login.js"></script>
</body>
</html>
