<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totem — Áudio sincronizado</title>
    <link rel="stylesheet" href="/static/css/design-system/styles.css">
    <link rel="stylesheet" href="/static/css/totem.css">
</head>
<body>
    <div class="totem-container">
        <!-- Video: populated dynamically by JS -->
        <video id="video" autoplay loop muted playsinline preload="auto"></video>

        <!-- Status -->
        <!-- <div class="status-bar">
            <div class="status-dot" id="statusDot"></div>
            <span class="status-text" id="statusText">Conectando...</span>
        </div> -->

        <!-- QR Code -->
        <div class="qr-overlay">
            <div class="qr-wrapper" id="qrWrapper"></div>
            <div class="qr-label">
                Escaneie para ouvir o áudio
            </div>
        </div>
    </div>

    <!-- QR Code library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <!-- Application script -->
    <script src="/static/js/totem.js"></script>
</body>
</html>
