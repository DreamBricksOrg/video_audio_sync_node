<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totem — Áudio sincronizado</title>
    <link rel="stylesheet" href="/static/css/design-system/styles.css">
    <link rel="stylesheet" href="/static/css/totem.css">
</head>
<body>
    <div class="totem-container">
        <!-- Video: populated dynamically by JS -->
        <video id="video" autoplay loop muted playsinline preload="auto"></video>

        <!-- Status -->
        <!-- <div class="status-bar">
            <div class="status-dot" id="statusDot"></div>
            <span class="status-text" id="statusText">Conectando...</span>
        </div> -->

        <!-- QR Code — also a link to the same mobile page (href set by totem.js) -->
        <a class="qr-overlay" id="qrLink" target="_blank" rel="noopener" aria-label="Abrir a página para ouvir o áudio">
            <div class="qr-wrapper" id="qrWrapper"></div>
            <div class="qr-label">
                Escaneie para ouvir o áudio
            </div>
        </a>

        <!-- "Ouvir aqui": visitor on a phone plays the audio on this device -->
        <button class="listen-btn" id="listenBtn" type="button" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/>
            </svg>
            <span>Ouvir aqui</span>
        </button>
    </div>

    <!-- QR Code library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <!-- Application scripts -->
    <script src="/static/js/local-audio.js"></script>
    <script src="/static/js/totem.js"></script>
</body>
</html>
