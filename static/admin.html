<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totem Control Center — DreamBricks</title>
    <link rel="stylesheet" href="/static/css/design-system/styles.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <img src="/static/images/dreambricks-horizontal-onlight.svg" alt="DreamBricks" class="brand-logo">
        </div>
    </header>

    <div class="admin-layout">
        <div class="page-header">
            <div>
                <h1>Totem Control Center</h1>
                <p class="page-subtitle">Choose the video and audio each totem plays, and open the mobile link.</p>
            </div>
            <button id="addTotemBtn" class="btn btn-primary">
                <i data-lucide="plus"></i> Add Totem
            </button>
        </div>

        <main class="grid-container" id="totemGrid">
            <!-- Populated via JS -->
        </main>
    </div>

    <!-- QR Code Modal -->
    <div id="qrModal" class="modal fade-out">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <button id="closeModalBtn" class="close-btn" aria-label="Close"><i data-lucide="x"></i></button>
            <h2 id="modalTitle">Mobile Link</h2>
            <div id="qrcode" class="qr-container"></div>
            <p id="qrUrl" class="qr-url"></p>
            <a id="openLinkBtn" href="#" target="_blank" class="btn btn-secondary btn-block">
                <i data-lucide="external-link"></i> Test Mobile View
            </a>
        </div>
    </div>

    <script src="/static/js/admin.js"></script>
</body>
</html>
