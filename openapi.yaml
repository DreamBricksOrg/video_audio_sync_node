openapi: 3.0.3
info:
  title: OOH Audio Sync API
  description: Backend APIs for the DreamBricks Audio-Video Sync Totem system.
  version: "1.0.0"
servers:
  - url: http://localhost:8001
    description: Local Node.js Server
paths:
  /health:
    get:
      summary: System Health Check
      description: |
        Status and metrics of the server, for uptime monitors. `checks` tells whether the media
        library, the campaigns config and the admin sessions storage are working; `version` is the
        package version plus the git commit.
      responses:
        '503':
          description: "Degraded: a check failed (e.g. S3 unreachable) — `status: degraded`, see `checks`"
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  server_time:
                    type: number
                    example: 1708892345.123
                  sessions:
                    type: integer
                    example: 2
                  mobile_clients:
                    type: integer
                    example: 10
                  drift_clients:
                    type: integer
                    example: 10
                  uptime_s:
                    type: integer
                    example: 3600

  /api/login:
    post:
      summary: Admin Login
      description: |
        Checks `ADMIN_USER` / `ADMIN_PASSWORD` from `.env` and sets the `db_admin` HttpOnly cookie
        (a random session id; only its hash is stored, in `sessions.json` — in the bucket in S3 mode,
        shared by every server). The session lasts until logout. All other `/api/*` routes require this cookie.
        After 5 failed attempts the IP is locked for 60 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Logged in (cookie set)
        '401':
          description: Invalid username or password
        '429':
          description: Too many failed attempts
        '503':
          description: Login not configured in `.env`

  /api/logout:
    post:
      summary: Admin Logout
      description: Ends the session on the server (a copied cookie stops working) and clears the cookie.
      responses:
        '200':
          description: Logged out
        '502':
          description: The session could not be removed from the storage

  /api/session:
    get:
      summary: Who Is Logged In
      responses:
        "200":
          description: "`{ user, role: admin|editor, main }` — `main` = the .env account"

  /api/users:
    get:
      summary: List Admin Users (Admin role)
      description: The .env account (main admin, edited only in .env) plus the users created in the admin. Never returns password hashes.
      responses:
        "200":
          description: "`[{ name, role, main, created, updated }]`"
        "403":
          description: Editor role
    post:
      summary: Create a User (Admin role)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password, role]
              properties:
                name: { type: string, description: "2–40 letters, numbers, ., - or _" }
                password: { type: string, description: "At least 8 characters (stored as a scrypt hash)" }
                role: { type: string, enum: [admin, editor] }
      responses:
        "201": { description: Created }
        "400": { description: Invalid name, password or role }
        "409": { description: Name already exists }

  /api/users/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    patch:
      summary: Change Role or Password (Admin role)
      description: A new password ends the user's open sessions; a new role applies at once.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [admin, editor] }
                password: { type: string }
      responses:
        "200": { description: Updated }
        "400": { description: The .env account, or invalid values }
        "404": { description: Not found }
    delete:
      summary: Delete a User (Admin role)
      description: Ends the user's sessions. Not the .env account, not yourself.
      responses:
        "200": { description: Deleted }
        "400": { description: The .env account or yourself }
        "404": { description: Not found }

  /api/audit:
    get:
      summary: Activity Log (Admin role)
      description: Who did what in the admin, newest first (this month and the previous one). Kept 12 months.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 300, maximum: 1000 } }
      responses:
        "200":
          description: "`{ entries: [{ time, user, action, target }] }`"

  /api/sessions:
    get:
      summary: Logged-in Browsers
      description: How many browsers/devices are logged in to the admin.
      responses:
        '200':
          description: Session count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, example: 2 }

  /api/sessions/revoke-others:
    post:
      summary: Disconnect Other Devices
      description: Ends every admin session except the one making the request.
      responses:
        '200':
          description: Sessions ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  revoked: { type: integer, example: 1 }
        '502':
          description: The sessions could not be saved to the storage

  /api/stats:
    get:
      summary: Daily Statistics
      description: |
        Counters per campaign per day (time zone `STATS_TIMEZONE`), kept for 90 days, shared by every
        server on the same bucket/prefix. No personal data. `listen_seconds / listens` = average listening time.
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        '200':
          description: Oldest day first; days without activity have empty `campaigns`
          content:
            application/json:
              example:
                timezone: America/Sao_Paulo
                days:
                  - date: "2026-10-07"
                    campaigns:
                      totem1: { screens: 12, scans: 5, listeners: 4, listen_seconds: 420, listens: 4, sites: { "loja.com.br": 10, "(direto)": 2 } }

  /api/stats.csv:
    get:
      summary: Statistics Spreadsheet
      description: Same data as `/api/stats` as a `;`-separated CSV (opens in Excel), one row per day and campaign.
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
        - name: campaign
          in: query
          schema: { type: string }
      responses:
        '200':
          description: CSV file (download)

  /api/totems:
    get:
      summary: List Registered Totems
      description: Returns a list of all totems and their current configurations (online status, mobile count, and assigned video).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "Totem_A"
                    is_online:
                      type: boolean
                      example: true
                    mobile_count:
                      type: integer
                      example: 3
                    video:
                      type: string
                      nullable: true
                      example: "ivete_video.mp4"
                    playlist:
                      type: array
                      description: Videos in order (loop), each with the audio phones play while it shows
                      items: { $ref: '#/components/schemas/PlaylistItem' }
                    schedule: { $ref: '#/components/schemas/Schedule' }
                    showing:
                      type: string
                      nullable: true
                      description: Campaign whose content is on air now (itself, its fallback, or null = black screen with logo)
    post:
      summary: Create Totem
      description: ID must be 1–40 letters, numbers, `-` or `_`. Video/audio are optional but must exist in `assets/`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, example: shopping_paulista_1 }
                video: { type: string, example: promo.mp4 }
                audio: { type: string, example: promo.mp3 }
                playlist:
                  type: array
                  description: Instead of video/audio, several videos in order (max 20)
                  items: { $ref: '#/components/schemas/PlaylistItem' }
                schedule: { $ref: '#/components/schemas/Schedule' }
      responses:
        '201':
          description: Created
        '400':
          description: Invalid ID or media not found
        '409':
          description: ID already exists

  /api/totem/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: totem1
    patch:
      summary: Update or Rename Totem
      description: |
        Updates video/audio and/or renames the totem (`id`). Settings and mobile links move to the new ID.
        If the totem screen is online it receives `change_screen` and reloads with `?screen=<new id>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, example: totem1_lobby }
                video: { type: string }
                audio: { type: string }
                playlist:
                  type: array
                  items: { $ref: '#/components/schemas/PlaylistItem' }
                schedule:
                  allOf: [{ $ref: '#/components/schemas/Schedule' }]
                  description: "null = always on air"
      responses:
        '200':
          description: Updated
        '400':
          description: Invalid ID or media not found
        '404':
          description: Totem not found
        '409':
          description: New ID already exists
    delete:
      summary: Delete Totem
      description: Removes the saved settings (video, audio, mobile links). `still_online` tells if its screen is still connected.
      responses:
        '200':
          description: Deleted
        '404':
          description: Totem not found

  /api/promo/options:
    get:
      summary: Mobile Links Editor Options
      description: Icon names allowed for link buttons, the max number of links and the default text/links.
      responses:
        '200':
          description: Options

  /api/totem/{id}/promo:
    put:
      summary: Update Mobile Page Text and Links
      description: |
        Sets what the mobile (audio) page shows for this totem: a message, the app download
        button (store link per device) and up to 6 link buttons. URLs must be http(s).
        Totems never edited use the default (99food) content.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: totem1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, example: "Enquanto escuta, saiba mais sobre a marca" }
                app:
                  type: object
                  properties:
                    label: { type: string, example: Baixar App }
                    ios: { type: string, example: "https://apps.apple.com/..." }
                    android: { type: string, example: "https://play.google.com/..." }
                    fallback: { type: string, example: "https://example.com" }
                links:
                  type: array
                  items:
                    type: object
                    properties:
                      label: { type: string, example: Site }
                      url: { type: string, example: "https://example.com" }
                      icon: { type: string, example: globe }
      responses:
        '200':
          description: Saved
        '400':
          description: Invalid URL, missing label or too many links

  /api/media/upload-url:
    post:
      summary: Sign a Direct Upload (S3 mode)
      description: |
        Returns a short-lived (10 min) presigned URL to PUT one file straight to the bucket,
        bound to its content type and size. In local mode returns `{ "direct": false }`:
        upload through `POST /api/media` instead. After the PUT, call `/api/media/upload-complete`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, size]
              properties:
                filename: { type: string, example: "promo.mp4" }
                size: { type: integer, description: "Bytes" }
                overwrite: { type: boolean }
                replace: { type: string, description: "Existing file whose content is replaced (same extension)" }
      responses:
        '200':
          description: "`{ direct, filename, url, headers, expires_in }` — send the PUT with exactly these headers"
        '400':
          description: Invalid name or empty file
        '404':
          description: "`replace` file not found"
        '409':
          description: "File exists (send `overwrite: true`)"
        '413':
          description: Larger than MAX_UPLOAD_MB

  /api/media/upload-complete:
    post:
      summary: Register a Direct Upload (S3 mode)
      description: Checks the file is in the bucket and adds it to the library.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename: { type: string }
      responses:
        '201':
          description: "`{ success, filename, type, size }`"
        '404':
          description: The file is not in the bucket

  /api/media/split:
    post:
      summary: Upload Video With Audio and Split
      description: |
        Uploads a video that has audio and saves two files in `assets/`:
        `<name>_video.<mp4|webm>` (no audio) and `<name>_audio.mp3` (aligned to the video timeline).
        Videos whose codec browsers can't play (e.g. HEVC/ProRes .mov) are re-encoded to H.264 MP4.
        The original upload is not kept. Requires ffmpeg/ffprobe on the server.
      parameters:
        - name: filename
          in: query
          required: true
          schema:
            type: string
          example: campanha.mov
        - name: overwrite
          in: query
          required: false
          description: Set to `1` to replace existing output files.
          schema:
            type: string
            enum: ["1"]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Split done
          content:
            application/json:
              schema:
                type: object
                properties:
                  video: { type: string, example: campanha_video.mp4 }
                  audio: { type: string, example: campanha_audio.mp3 }
                  transcoded: { type: boolean }
                  duration: { type: number, example: 30.0 }
        '400':
          description: Not a video, or the video has no audio track
        '409':
          description: Output files already exist (`files` lists them)
        '413':
          description: File exceeds the size limit

  /api/media/{filename}:
    parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
        example: promo.mp4
    put:
      summary: Replace File Content
      description: Overwrites an existing file with the raw request body, keeping its name.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: File replaced
        '404':
          description: File not found
        '413':
          description: File exceeds the size limit
    patch:
      summary: Rename File
      description: |
        Renames a file (the name is sanitized; a video must stay a video, an audio an audio).
        Totems using the file are updated to the new name, and online totems switch video immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename: { type: string, example: new-name.mp4 }
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  filename: { type: string }
                  updated_totems: { type: array, items: { type: string } }
        '400':
          description: Invalid name or type change
        '404':
          description: File not found
        '409':
          description: Another file already has this name
    delete:
      summary: Delete File
      description: Deletes a file. Refused while any totem is configured to use it.
      responses:
        '200':
          description: Deleted
        '404':
          description: File not found
        '409':
          description: File is in use (`used_by` lists the totems)

  /api/media:
    get:
      summary: List Media Files
      description: All videos and audios in `assets/`, with size, last modified date and the totems using each file.
      responses:
        '200':
          description: Media list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    filename: { type: string, example: promo.mp4 }
                    type: { type: string, enum: [video, audio] }
                    size: { type: integer }
                    modified: { type: string, format: date-time }
                    used_by: { type: array, items: { type: string } }
    post:
      summary: Upload Video or Audio
      description: |
        Saves a video (.mp4, .webm) or audio (.mp3, .wav, .ogg) file into the `assets/` directory.
        The request body is the raw file bytes. The filename is sanitized (accents removed,
        unsupported characters replaced with `_`). Max size is `MAX_UPLOAD_MB` (default 500 MB).
      parameters:
        - name: filename
          in: query
          required: true
          schema:
            type: string
          example: promo.mp4
        - name: overwrite
          in: query
          required: false
          description: Set to `1` to replace an existing file with the same name.
          schema:
            type: string
            enum: ["1"]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: File saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  filename: { type: string, example: promo.mp4 }
                  type: { type: string, enum: [video, audio] }
                  size: { type: integer, example: 1048576 }
        '400':
          description: Invalid filename/extension, empty file or aborted upload
        '409':
          description: A file with this name already exists (retry with `overwrite=1`)
        '413':
          description: File exceeds the size limit

  /api/totem/{id}/config:
    post:
      summary: Set the Videos of a Totem
      description: |
        Sets what a campaign plays: `{ playlist: [{ video, audio }] }` (videos in order, loop) or the
        single `{ video, audio }`. Every item needs a video and an audio here. Open screens switch right away.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          example: totem1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                video: { type: string, example: promo.mp4 }
                audio: { type: string, example: promo.mp3 }
                playlist:
                  type: array
                  items: { $ref: "#/components/schemas/PlaylistItem" }
      responses:
        "200":
          description: "`{ success, id, video, audio, playlist }`"
        "400":
          description: Missing video/audio or file not in the library

  /media/{filename}:
    get:
      summary: Stream Media File
      description: Streams a video or audio file with support for HTTP Range requests.
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
          description: The filename of the media to stream
      responses:
        '200':
          description: Full file content
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content (Range response)
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid filename path
        '404':
          description: File not found
        '416':
          description: Range not satisfiable

components:
  schemas:
    PlaylistItem:
      type: object
      properties:
        video: { type: string, example: verao_video.mp4 }
        audio: { type: string, example: verao_audio.mp3, description: "Empty = silence on the phone during this video" }
    Schedule:
      type: object
      nullable: true
      description: Period on air (UTC ISO dates, both optional). Outside it the campaign shows `fallback`'s content, or a black screen with the logo.
      properties:
        start: { type: string, format: date-time, nullable: true }
        end: { type: string, format: date-time, nullable: true }
        fallback: { type: string, nullable: true, description: Another campaign id }
